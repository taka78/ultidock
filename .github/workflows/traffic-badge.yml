name: Update GitHub Traffic Badge

on:
  schedule:
    - cron: '0 0 * * 0'  # every Sunday at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: traffic-badge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-traffic:
    if: startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install requests

      - name: Fetch traffic data and write JSON
        run: python .github/scripts/update_traffic_badge.py
        env:
          GH_TOKEN: ${{ secrets.GH_TRAFFIC_TOKEN }}
          REPO: ${{ github.repository }}

      - name: Commit badge file if changed
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git add -- traffic-badge.json
          if git diff --cached --quiet -- traffic-badge.json; then
            echo "Traffic badge is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Update traffic badge" -- traffic-badge.json
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
