[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ultidock"
version = "1.1.2"
requires-python = ">=3.10"
description = "Ultidock workflow CLI with MolGuard deterministic molecular I/O"
dependencies = [
    # I/O hardening CLI
    "click>=8.1",
    "tomli>=2.0; python_version < '3.11'",
    # Scientific core (also required by docking/ scripts)
    "numpy>=1.24",
    "scipy>=1.10",
    "psutil>=5.9",
    # Data analysis — optional but expected in full pipeline
    "matplotlib>=3.7",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "hypothesis>=6.82",
    "ruff>=0.1",
    "mypy>=1.5",
]

[project.scripts]
ultidock = "ultidock.cli:cli"
molguard = "cli.molguard:cli"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = [
    "ultidock", "molguard*", "cli", "docking", "benchmarks",
    "benchmarks.baseline", "benchmarks.baseline.fpocket", "benchmarks.baseline.p2rank",
    "benchmarks.site_prediction", "benchmarks.site_prediction.evaluation",
]
exclude = ["molguard.tests*"]

[tool.setuptools.cmdclass]
build_py = "ultidock._build.BuildPy"

[tool.pytest.ini_options]
testpaths = ["molguard/tests"]
addopts   = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
